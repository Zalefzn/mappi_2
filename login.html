<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk · MAPPI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <style>
    :root { --mappi-blue: #010b69; --mappi-accent: #0b2c85; --btn-blue: #010b69; }
    body {
      min-height: 100vh;
      background:
        radial-gradient(900px 420px at 6% 4%, #eaf2ff 0%, rgba(234,242,255,.65) 40%, rgba(234,242,255,0) 70%),
        radial-gradient(900px 420px at 96% 90%, #eaf2ff 0%, rgba(234,242,255,.65) 40%, rgba(234,242,255,0) 70%),
        linear-gradient(120deg,#eef6ff 0%,#ffffff 48%,#e9f2ff 100%);
      background-attachment: fixed;
    }
    .decor { position: fixed; border-radius: 50%; background: var(--mappi-accent); pointer-events: none; z-index: 0; }
    .decor.tl { top: -140px; left: -140px; width: 360px; height: 360px; }
    .decor.br { right: -180px; bottom: -180px; width: 500px; height: 500px; }
    .brand-title { color: var(--mappi-blue); }
    .brand-sub { color: var(--mappi-blue); opacity: .85; }
    .form-wrap { max-width: 460px; position: relative; z-index: 1; }
    .form-control { border-radius: .6rem; }
    .btn-mappi { background: var(--btn-blue); color: #fff; border: 0; border-radius: 999px; }
    .btn-mappi:hover { background: #0b2c85; color: #fff; }
    .link-muted { color: #6c757d; text-decoration: none; }
    .link-muted:hover { color: #495057; }

    @media (max-width: 991.98px) {
      .decor.tl { top: -160px; left: -160px; width: 280px; height: 280px; }
      .decor.br { right: -220px; bottom: -220px; width: 380px; height: 380px; }
      .form-wrap { max-width: 520px; }
    }

    @media (max-width: 767.98px) {
      .decor.tl { top: -120px; left: -120px; width: 220px; height: 220px; }
      .decor.br { right: -260px; bottom: -260px; width: 340px; height: 340px; }
      .form-wrap { max-width: 92%; }
    }

    @media (max-width: 575.98px) {
      .decor.tl { top: -100px; left: -100px; width: 180px; height: 180px; }
      .decor.br { display: none; }
    }
  </style>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body>
  <div class="decor tl"></div>
  <div class="decor br"></div>

  <div class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="w-100 form-wrap">
      <div class="text-center mb-4">
        <img src="img/images (1).jpg" alt="Logo MAPPI" style="width:64px;height:auto" class="mb-2">
        <div class="fs-2 fw-bold brand-title">MAPPI</div>
        <div class="small brand-sub">Masyarakat Profesi Penilai Indonesia</div>
        <div class="small brand-sub">Indonesian Society of Appraisers</div>
      </div>

      <form class="d-flex flex-column gap-3">
        <div>
          <label for="email" class="form-label">Email</label>
          <input type="email" id="email" class="form-control" placeholder="Your email" autocomplete="email">
        </div>
        <div>
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Your password" autocomplete="current-password">
          <div class="mt-1 text-end">
            <a href="#" class="link-primary small">Forgot password?</a>
          </div>
        </div>
        <button type="submit" class="btn btn-mappi py-2">Masuk</button>
        <div class="text-center small">
          <span class="text-muted">Belum punya akun?</span>
          <a href="#" class="link-primary">Daftar sekarang!</a>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
